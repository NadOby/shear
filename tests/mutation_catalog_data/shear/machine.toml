"""

[[survivor]]
kind = "constant"
source = "False,"
occurrence = 2
classification = "equivalent"
reason = """
This is the tail flag of the catch continuation frame. Its chunk is CATCH_OK
then END, and neither reads the flag; END restores the enclosing frame's own
flag. An unwound failure restores this frame and runs the same two
instructions.
"""

