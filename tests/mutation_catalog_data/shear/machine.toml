[[survivor]]
kind = "boolean"
source = "not handlers"
occurrence = 0
classification = "equivalent"
reason = """
CATCH_OK runs only from the continuation pushed together with its handler,
and unwinding removes handlers and their continuations together, so the
matching handler is always on top. The mutated guard differs only when that
internal invariant is already broken.
"""

