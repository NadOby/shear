[[survivor]]
kind = "constant"
source = "at_start = False"
occurrence = 0
classification = "unspecified"
reason = """
Changing False to True lets the prescan treat later bare 'cell' or 'fn'
token sequences on the same top-level line as declarations. No valid grammar
form contains such a sequence after the declaration start. It can therefore
change which SourceError is reached for malformed input, but cannot change
acceptance or semantics of a valid program. Exact malformed-input diagnostic
ordering is not specified.
"""

