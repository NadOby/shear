[[survivor]]
kind = "constant"
source = "_ORDINARY, _HOLES = 0, 1"
occurrence = 1
classification = "equivalent"
reason = """
_HOLES is an internal mode tag. Code enters hole mode using _HOLES and tests
for that same symbolic value; its numeric value is neither serialized nor
otherwise interpreted. Changing the tag from 1 to 2 therefore preserves all
behaviour.
"""

[[survivor]]
kind = "arithmetic"
source = "return self.tokens[min(self.pos + ahead, len(self.tokens) - 1)]"
occurrence = 1
classification = "equivalent"
reason = """
This mutation changes the upper clamp from len(tokens)-1 to len(tokens)+1.
Every internal peek uses ahead=0 except the guarded one-token lookaheads for
'=' while the current token is a name. Those lookaheads necessarily occur
before the synthetic NEWLINE/EOF tail, so self.pos+ahead never exceeds the
last token index and the changed clamp is never selected.
"""

