source = "return \"end of text\""
occurrence = 0
classification = "unspecified"
reason = """
Public parse paths do not call _describe on EOF: tokenization inserts a
synthetic NEWLINE before EOF for every source line, and parser paths either
handle EOF explicitly or reject that structural token first. Calling the
private helper directly with an EOF Token is outside the syntax API,
including its exact descriptive return value.
"""

