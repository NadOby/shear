classification = "unspecified"
reason = """
The default is used by activate's TARGET = VALUE parser. Changing it to
False only changes how activate() is rejected: instead of the explicit
empty-list diagnostic, target_pair consumes the closing parenthesis and
global_function raises SourceError on that same token. Acceptance and source
position are unchanged; exact diagnostic prose is not specified.
"""

