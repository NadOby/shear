name: Semantic model

on:
  workflow_dispatch:
    inputs:
      generated_cases:
        description: "Generated cases per participating family; 0 uses ordinary defaults"
        required: false
        default: "0"
      mutation_count:
        description: "Mutation sites per target per batch; 0 skips the heavy mutation campaign"
        required: false
        default: "0"
      mutation_seed:
        description: "Mutation ordering seed"
        required: false
        default: "1"
      mutation_batch:
        description: "Zero-based disjoint mutation batch"
        required: false
        default: "0"
      mutation_shards:
        description: "Mutation campaign shards, 1 to 16; empty sizes it from the selected mutants (one shard per 150, at most 16)"
        required: false
        default: ""
      content_baseline:
        description: "Run task 23 bootstrap measurements (diagnostic only)"
        required: false
        default: false
        type: boolean
      hosted_diagnostics:
        description: "Run task 30 hosted-pipeline measurements (diagnostic only)"
        required: false
        default: false
        type: boolean

  push:
    paths:
      - "shear/**"
      - "tests/**"
      - "README.md"
      - "CLAUDE.md"
      - "CHANGES.md"
      - "docs/**"
      - ".github/workflows/semantic-model.yml"

  pull_request:
    paths:
      - "shear/**"
      - "tests/**"
      - "README.md"
      - "CLAUDE.md"
      - "CHANGES.md"
      - "docs/**"
      - ".github/workflows/semantic-model.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    name: tests

    env:
      SHEAR_CASES: ${{ inputs.generated_cases || '0' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run every lane, one process per lane
        run: python -m tests.lanes --all

      - name: Compare golden records with the base
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            python -m tests.golden --base "$BEFORE"
          else
            python -m tests.golden --against origin/main
          fi

  content-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.content_baseline == true }}
    needs: tests

    runs-on: ubuntu-latest
    name: content baseline diagnostics

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Record deterministic content inventory
        run: python -m tests.content_baseline inventory > content-inventory.json

      - name: Measure bootstrap costs
        shell: bash
        run: |
          set -o pipefail
          python -m tests.content_baseline_measure | tee content-baseline.json

      - name: Upload task 23 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: content-baseline-${{ github.sha }}
          path: |
            content-inventory.json
            content-baseline.json
          if-no-files-found: warn

  mutation-plan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mutation_count != '' && inputs.mutation_count != '0' }}

    runs-on: ubuntu-latest
    name: mutation plan

    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Size the shard matrix from the selected mutants
        id: plan
        env:
          COUNT: ${{ inputs.mutation_count }}
          SEED: ${{ inputs.mutation_seed }}
          BATCH: ${{ inputs.mutation_batch }}
          SHARDS: ${{ inputs.mutation_shards }}
        run: >-
          python -m tests.mutation_campaign plan
          --count "$COUNT"
          --seed "$SEED"
          --batch "$BATCH"
          --shards "$SHARDS"

  mutation-campaign:
    needs: mutation-plan

    runs-on: ubuntu-latest
    name: mutation campaign (shard ${{ matrix.shard }}/${{ needs.mutation-plan.outputs.count }})

    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}

    env:
      SHEAR_MUTATE: ${{ inputs.mutation_count }}
      SHEAR_MUTATE_SEED: ${{ inputs.mutation_seed }}
      SHEAR_MUTATE_BATCH: ${{ inputs.mutation_batch }}
      SHEAR_MUTATE_SHARDS: ${{ needs.mutation-plan.outputs.count }}
      SHEAR_MUTATE_SHARD: ${{ matrix.shard }}
      SHEAR_MUTATION_REPORT: mutation-report-batch-${{ inputs.mutation_batch }}-shard-${{ matrix.shard }}.jsonl

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run mutation batch shard
        run: python -m tests.lanes mutation

      - name: Upload mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-evidence-batch-${{ inputs.mutation_batch }}-shard-${{ matrix.shard }}
          path: mutation-report-batch-${{ inputs.mutation_batch }}-shard-${{ matrix.shard }}.jsonl
          if-no-files-found: warn

  hosted-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.hosted_diagnostics == true }}

    runs-on: ubuntu-latest
    name: task 30 hosted-pipeline diagnostics

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Measure the hosted pipeline
        shell: bash
        run: |
          set -o pipefail
          python -m shear.hosted_bootstrap.diagnostics | tee hosted-diagnostics.json

      - name: Upload task 30 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hosted-diagnostics-${{ github.sha }}
          path: hosted-diagnostics.json
          if-no-files-found: warn
