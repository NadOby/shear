name: Semantic model

on:
  workflow_dispatch:
    inputs:
      generated_cases:
        description: "Generated cases per participating family; 0 uses ordinary defaults"
        required: false
        default: "0"
      mutation_count:
        description: "Mutation sites per target per batch; 0 skips the heavy mutation campaign"
        required: false
        default: "0"
      mutation_seed:
        description: "Mutation ordering seed"
        required: false
        default: "1"
      mutation_batch:
        description: "Zero-based disjoint mutation batch"
        required: false
        default: "0"
      mutation_shards:
        description: "Mutation campaign shards, 1 to 16; empty sizes it from the selected mutants (one shard per 150, at most 16)"
        required: false
        default: ""
      python_version:
        description: "Python for the mutation plan and campaign shards (evidence for moving CI to a newer Python)"
        required: false
        default: "3.14"
      mutation_revalidate:
        description: "Also re-run reviewed survivors (use after repinning the engine or a target)"
        required: false
        default: false
        type: boolean
      coverage_diagnostics:
        description: "Report executable lines of mutation targets that no oracle module executes (diagnostic only)"
        required: false
        default: false
        type: boolean
      coverage_targets:
        description: "Target path prefixes for the coverage diagnostic, space separated; empty selects every target"
        required: false
        default: ""
      content_baseline:
        description: "Run task 23 bootstrap measurements (diagnostic only)"
        required: false
        default: false
        type: boolean
      hosted_diagnostics:
        description: "Run task 30 hosted-pipeline measurements (diagnostic only)"
        required: false
        default: false
        type: boolean

  push:
    paths:
      - "shear/**"
      - "tests/**"
      - "README.md"
      - "CLAUDE.md"
      - "CHANGES.md"
      - "docs/**"
      - ".github/workflows/semantic-model.yml"

  pull_request:
    paths:
      - "shear/**"
      - "tests/**"
      - "README.md"
      - "CLAUDE.md"
      - "CHANGES.md"
      - "docs/**"
      - ".github/workflows/semantic-model.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    name: tests

    env:
      SHEAR_CASES: ${{ inputs.generated_cases || '0' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run every lane, one process per lane
        run: python -m tests.lanes --all

      - name: Compare golden records with the base
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            python -m tests.golden --base "$BEFORE"
          else
            python -m tests.golden --against origin/main
          fi

  content-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.content_baseline == true }}
    needs: tests

    runs-on: ubuntu-latest
    name: content baseline diagnostics

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Record deterministic content inventory
        run: python -m tests.content_baseline inventory > content-inventory.json

      - name: Measure bootstrap costs
        shell: bash
        run: |
          set -o pipefail
          python -m tests.content_baseline_measure | tee content-baseline.json

      - name: Upload task 23 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: content-baseline-${{ github.sha }}
          path: |
            content-inventory.json
            content-baseline.json
          if-no-files-found: warn

  mutation-plan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mutation_count != '' && inputs.mutation_count != '0' }}

    runs-on: ubuntu-latest
    name: mutation plan

    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      revalidate: ${{ steps.revalidate.outputs.revalidate }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reviewed survivors are not re-run, which is only sound while their
      # review is current. A change to the engine or the survivor catalog
      # against main is a repin, so the campaign re-runs them.
      - name: Revalidate reviewed survivors when the review changed
        id: revalidate
        shell: bash
        run: |
          if [ -n "$(git diff --name-only origin/main...HEAD -- tests/mutation.py tests/mutation_catalog_data)" ]; then
            echo "revalidate=1" >> "$GITHUB_OUTPUT"
            echo "Engine or survivor catalog differs from main: reviewed survivors will be re-run."
          else
            echo "revalidate=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version || '3.14' }}

      - name: Size the shard matrix from the selected mutants
        id: plan
        env:
          COUNT: ${{ inputs.mutation_count }}
          SEED: ${{ inputs.mutation_seed }}
          BATCH: ${{ inputs.mutation_batch }}
          SHARDS: ${{ inputs.mutation_shards }}
        run: >-
          python -m tests.mutation_campaign plan
          --count "$COUNT"
          --seed "$SEED"
          --batch "$BATCH"
          --shards "$SHARDS"

      # Orders each mutant's run (modules that execute its line first); it
      # never changes which tests run or the outcome, so a failure here only
      # costs speed and the shards then run in the default order.
      - name: Build the coverage map once for every shard
        continue-on-error: true
        run: python -m tests.mutation_coverage build --out mutation-coverage-map.json

      - name: Upload the coverage map
        uses: actions/upload-artifact@v7
        with:
          name: mutation-coverage-map
          path: mutation-coverage-map.json
          if-no-files-found: warn

  mutation-campaign:
    needs: mutation-plan

    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: mutation campaign (shard ${{ matrix.shard }}/${{ needs.mutation-plan.outputs.count }})

    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}

    env:
      SHEAR_MUTATE: ${{ inputs.mutation_count }}
      SHEAR_MUTATE_SEED: ${{ inputs.mutation_seed }}
      SHEAR_MUTATE_BATCH: ${{ inputs.mutation_batch }}
      SHEAR_MUTATE_SHARDS: ${{ needs.mutation-plan.outputs.count }}
      SHEAR_MUTATE_SHARD: ${{ matrix.shard }}
      SHEAR_MUTATION_REPORT: mutation-report-batch-${{ inputs.mutation_batch }}-shard-${{ matrix.shard }}.jsonl
      SHEAR_MUTATE_REVALIDATE: ${{ inputs.mutation_revalidate && '1' || needs.mutation-plan.outputs.revalidate }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version || '3.14' }}

      - name: Download the coverage map
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: mutation-coverage-map

      - name: Run mutation batch shard
        shell: bash
        run: |
          if [ -f mutation-coverage-map.json ]; then
            export SHEAR_MUTATION_COVERAGE=mutation-coverage-map.json
          fi
          python -m tests.lanes mutation

      - name: Summarize this shard
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f "$SHEAR_MUTATION_REPORT" ]; then
            python -m tests.mutation_performance "$SHEAR_MUTATION_REPORT" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-evidence-batch-${{ inputs.mutation_batch }}-shard-${{ matrix.shard }}
          path: mutation-report-batch-${{ inputs.mutation_batch }}-shard-${{ matrix.shard }}.jsonl
          if-no-files-found: warn

  mutation-summary:
    needs: [mutation-plan, mutation-campaign]
    if: ${{ always() && needs.mutation-plan.result == 'success' }}

    runs-on: ubuntu-latest
    name: mutation campaign summary

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Download every shard's report
        uses: actions/download-artifact@v7
        with:
          pattern: mutation-evidence-*
          merge-multiple: true

      - name: Summarize the whole campaign
        shell: bash
        run: |
          python -m tests.mutation_performance mutation-report-*.jsonl --json mutation-performance.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the performance summary
        uses: actions/upload-artifact@v7
        with:
          name: mutation-performance-batch-${{ inputs.mutation_batch }}
          path: mutation-performance.json
          if-no-files-found: warn

  coverage-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage_diagnostics == true }}

    runs-on: ubuntu-latest
    name: mutation coverage diagnostics

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Report executable lines no oracle module executes
        shell: bash
        env:
          TARGETS: ${{ inputs.coverage_targets }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          python -m tests.mutation_coverage report --json coverage-report.json $TARGETS | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-coverage-report-${{ github.sha }}
          path: coverage-report.json
          if-no-files-found: warn

  hosted-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.hosted_diagnostics == true }}

    runs-on: ubuntu-latest
    name: task 30 hosted-pipeline diagnostics

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Measure the hosted pipeline
        shell: bash
        run: |
          set -o pipefail
          python -m shear.hosted_bootstrap.diagnostics | tee hosted-diagnostics.json

      - name: Upload task 30 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hosted-diagnostics-${{ github.sha }}
          path: hosted-diagnostics.json
          if-no-files-found: warn
